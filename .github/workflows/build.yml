name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: macos,   os: macos-latest }
          - { name: linux,   os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4

      - name: Read version from CMakeLists.txt
        shell: bash
        run: echo "VERSION=$(sed -n 's/^project(AudioVisualizer VERSION \([0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Validate VST3 with pluginval (Windows, informational)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process "build/AudioVisualizer_artefacts/Release/VST3/AudioVisualizer.vst3"

      - name: Package
        shell: bash
        run: |
          OUT="dist/AudioVisualizer-${VERSION}-${{ matrix.name }}"
          ART="build/AudioVisualizer_artefacts/Release"
          mkdir -p "$OUT"
          cp -R "$ART/VST3/AudioVisualizer.vst3" "$OUT/"
          cp -R "$ART/CLAP/AudioVisualizer.clap" "$OUT/"
          case "${{ matrix.name }}" in
            windows) cp "$ART/Standalone/AudioVisualizer.exe" "$OUT/" ;;
            macos)   cp -R "$ART/Standalone/AudioVisualizer.app" "$OUT/"
                     cp -R "$ART/AU/AudioVisualizer.component" "$OUT/" ;;
            linux)   cp "$ART/Standalone/AudioVisualizer" "$OUT/" ;;
          esac
          cp -R ContentPack "$OUT/"
          cp LICENSE README.md "$OUT/"
          cd dist
          if command -v zip >/dev/null 2>&1; then
            zip -qry "AudioVisualizer-${VERSION}-${{ matrix.name }}.zip" "AudioVisualizer-${VERSION}-${{ matrix.name }}"
          else
            7z a -tzip -bso0 "AudioVisualizer-${VERSION}-${{ matrix.name }}.zip" "AudioVisualizer-${VERSION}-${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AudioVisualizer-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "AudioVisualizer ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
